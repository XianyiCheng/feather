# Minimal tmux config for the embedded terminal panel
# Enables mouse scroll to scroll the terminal buffer instead of triggering arrow keys.

set -g mouse on

# Exit copy mode automatically after scrolling back to the bottom
set -g history-limit 50000

# Don't show tmux status bar — this is an embedded terminal
set -g status off

# Faster escape so vim/claude feel responsive
set -sg escape-time 10
