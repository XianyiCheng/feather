<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0f172a"/>
  <!-- Feather quill — single elegant stroke -->
  <g transform="translate(256,256) rotate(-30)">
    <!-- Main feather body -->
    <path d="M0,-160 C40,-120 50,-60 30,0 C20,40 10,80 -10,140 C-12,146 -8,148 -4,144 C20,100 60,40 80,-20 C100,-70 90,-130 40,-160 Z" fill="url(#g)" opacity="0.9"/>
